name: Inference test
on:
  workflow_dispatch:

jobs:
  start-brev-runner:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.brev-start.outputs.mapping }}
      instances: ${{ steps.brev-start.outputs.instances }}
    steps:
      - name: Create cloud runner
        id: brev-start
        uses: omsf-eco-infra/start-brev-gha-runner@99faf2f82c9c64b1762ff6c129b20c0f006086f2
        with:
          brev_instance_type: g6e.xlarge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BREV_API_KEY: ${{ secrets.BREV_API_TOKEN }}
  inference-test:
    runs-on: ${{ fromJSON(needs.start-aws-runner.outputs.instances) }}
    defaults:
      run:
        shell: bash -leo pipefail {0}
    needs:
      - start-brev-runner
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            inference-test
          repository: omsf-eco-infra/ci-scripts
          path: ci-scripts
      - name: Print disk usage
        run: "df -h"
      - name: Print Docker details
        run: "docker version || true"
      - name: Check for nvidia-smi
        run: "nvidia-smi || true"
      - uses: mamba-org/setup-micromamba@main
        with:
          environment-file: ci-scripts/inference-test/environment.yml
      - name: Test for pytorch
        run: python -c "import torch; assert torch.cuda.is_available()"
      - name: Test for GPU
        id: gpu_test
        run: python ci-scripts/inference-test/inference.py
  stop-brev-runner:
    runs-on: ubuntu-latest
    needs:
      - start-brev-runner
      - inference-test
    if: ${{ always() }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Stop instances
        uses: omsf-eco-infra/stop-brev-gha-runner@c58e34f10c159af970e0fdb42a12bdc4a3b846aa
        with:
          instance_mapping: ${{ needs.start-brev-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BREV_API_KEY: ${{ secrets.BREV_API_TOKEN }}
